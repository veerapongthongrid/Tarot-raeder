    <div class="tab-container">

            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.getElementById('tarotSection').classList.remove('active');
            document.getElementById('siemtsiSection').classList.remove('active');
            document.getElementById('tabTarot').classList.remove('active');
            document.getElementById('tabSiemtsi').classList.remove('active');

            if (tabName === 'tarot') {
                document.getElementById('tarotSection').classList.add('active');
                document.getElementById('tabTarot').classList.add('active');
            } else {
                document.getElementById('siemtsiSection').classList.add('active');
                document.getElementById('tabSiemtsi').classList.add('active');
            }
        }

        const positionLabels = [
            "ตำแหน่งที่ 1: สถานการณ์ปัจจุบัน / อดีตที่ส่งผล",
            "ตำแหน่งที่ 2: ปัญหา / อุปสรรคที่ต้องเจอ",

            "ตำแหน่งที่ 5: บทสรุปผลลัพธ์ / โชคลาภ"
        ];

        let currentCards = [];

        function getRandomCard(excludeList) {
            let available = tarotDeck.filter(card => !excludeList.includes(card.name));
            if (available.length === 0) return null;
            let randomIndex = Math.floor(Math.random() * available.length);
            return available[randomIndex];
        }

        function drawInitialCards() {
            currentCards = [];
            for (let i = 0; i < 3; i++) {
                let card = getRandomCard(currentCards.map(c => c.name));
                if (card) currentCards.push(card);
            }
            renderCards();
            document.getElementById('draw3Btn').disabled = true;
            document.getElementById('drawExtraBtn').disabled = false;
        }

        function drawExtraCard() {
            if (currentCards.length < 5) {
                let card = getRandomCard(currentCards.map(c => c.name));
                if (card) {
                    currentCards.push(card);
                    renderCards();
                }
                if (currentCards.length >= 5) {
                    document.getElementById('drawExtraBtn').disabled = true;
                }
            }
        }

        function resetCards() {
            currentCards = [];
            document.getElementById('cardsContainer').innerHTML = '';
            document.getElementById('draw3Btn').disabled = false;
            document.getElementById('drawExtraBtn').disabled = true;
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            currentCards.forEach((card, index) => {
                let box = document.createElement('div');
                box.className = 'card-box';
                box.innerHTML = `
                    <div class="card-img-container">
                        <img src="${card.img}" alt="${card.name}" class="card-img">
                    </div>
                    <div class="card-info">
                        <div class="position-label">${positionLabels[index]}</div>
                        <div class="card-title">${card.name} (${card.th})</div>
                        <div class="card-desc">${card.meaning}</div>
                    </div>
                `;
                container.appendChild(box);
            });
        }
