    <title>Tarot 78 Cards - Private Reader</title>
    <style>

        .btn-container {

            flex-wrap: wrap;

            gap: 8px;
        }
        button {
            background-color: #d4af37;
            color: #121212;
            border: none;
            padding: 12px 18px;

            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }
        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            max-width: 450px;
            margin: 0 auto;
        }
        .card-box {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: left;
        }
        .card-img-container {
            flex-shrink: 0;
            width: 90px;
            height: 150px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #d4af37;
            background-color: #000;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .position-label {
            font-size: 0.75rem;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .card-title {
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 6px;
        }
        .card-desc {
            font-size: 0.85rem;
            color: #ccc;
            line-height: 1.3;
        }
    </style>
</head>
